<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Ilustración de cancha de pickleball">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1224"/>
      <stop offset="1" stop-color="#0a0e1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#c9f24d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c9f24d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f4d7d"/>
      <stop offset="1" stop-color="#0a3a61"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <g transform="translate(600 470) scale(1)">
    <polygon points="-420,170 -240,-130 240,-130 420,170" fill="url(#court)" stroke="#ffffff" stroke-width="6"/>
    <line x1="-330" y1="60" x2="330" y2="60" stroke="#ffffff" stroke-width="6"/>
    <line x1="-240" y1="-130" x2="-240" y2="170" stroke="#ffffff" stroke-width="6"/>
    <line x1="240" y1="-130" x2="240" y2="170" stroke="#ffffff" stroke-width="6"/>
    <line x1="0" y1="-130" x2="0" y2="60" stroke="#ffffff" stroke-width="4" stroke-dasharray="12 10"/>
    <rect x="-120" y="-55" width="240" height="14" rx="7" fill="#c9f24d" opacity="0.9"/>
  </g>

  <g transform="translate(600 620)">
    <circle cx="0" cy="0" r="42" fill="#c9f24d"/>
    <circle cx="-12" cy="-12" r="7" fill="#0a0e1c"/>
    <circle cx="12" cy="-12" r="7" fill="#0a0e1c"/>
    <circle cx="-12" cy="12" r="7" fill="#0a0e1c"/>
    <circle cx="12" cy="12" r="7" fill="#0a0e1c"/>
    <circle cx="0" cy="0" r="7" fill="#0a0e1c"/>
  </g>

  <text x="600" y="720" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#eef2ff" opacity="0.9">PICKLEBALL</text>
  <text x="600" y="752" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" letter-spacing="5" fill="#99a3c3">BOQUETE · TU PRÓXIMO PARTIDO</text>
</svg>